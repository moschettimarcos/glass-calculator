<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background">
        <span class="blob purple"></span>
        <span class="blob cyan"></span>
        <span class="blob pink"></span>
    </div>

    <main class="page">
        <div class="calculator">
            <div class="display">
                <div class="previous" id="previous"></div>
                <div class="current" id="current">0</div>
            </div>

            <div class="keys">

                <button class="key fn" data-action="clear">AC</button>
                <button class="key fn" data-action="delete" aria-label="Delete">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 5H9l-6 7 6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z" />
                        <path d="M12 9l6 6M18 9l-6 6" />
                    </svg>
                </button>

                <button class="key fn" data-action="percent">%</button>
                <button class="key op" data-op="÷">÷</button>

                <button class="key" data-number="7">7</button>
                <button class="key" data-number="8">8</button>
                <button class="key" data-number="9">9</button>
                <button class="key op" data-op="x">x</button>

                <button class="key" data-number="4">4</button>
                <button class="key" data-number="5">5</button>
                <button class="key" data-number="6">6</button>
                <button class="key op" data-op="-">-</button>

                <button class="key" data-number="1">1</button>
                <button class="key" data-number="2">2</button>
                <button class="key" data-number="3">3</button>
                <button class="key op" data-op="+">+</button>

                <button class="key zero" data-number="0">0</button>
                <button class="key" data-number=".">.</button>
                <button class="key equals" data-action="equals">=</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
